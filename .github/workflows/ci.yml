name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Generate Prisma clients
        run: |
          npx prisma generate --schema=packages/database/prisma/auth-schema.prisma
          npx prisma generate --schema=packages/database/prisma/bus-schema.prisma
          npx prisma generate --schema=packages/database/prisma/ticket-schema.prisma

      - name: Build (turbo)
        run: npx turbo run build

      - name: Test ticket-api
        run: npm test --workspace services/ticket-api

      - name: Test auth-api
        run: npm test --workspace services/auth-api

      - name: Test bus-api
        run: npm test --workspace services/bus-api
